name: Offline test suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned test environment (Python 3.9-3.12)
        if: matrix.python-version != '3.13'
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Install pinned analysis environment (Python 3.13)
        if: matrix.python-version == '3.13'
        run: python -m pip install --disable-pip-version-check -r requirements-analysis.txt

      - name: Run offline tests
        id: offline_tests
        shell: bash
        env:
          AGENT_LAB_NO_BROWSER: "1"
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee pytest-output.txt

      - name: Publish offline-test failure annotation
        if: failure() && steps.offline_tests.outcome == 'failure'
        shell: bash
        run: >-
          python -c "from pathlib import Path;
          text=Path('pytest-output.txt').read_text(encoding='utf-8', errors='replace');
          marker='=================================== FAILURES';
          failure=(text[text.find(marker):] if marker in text else text)[-8000:];
          escaped=failure.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A');
          print('::error title=Offline test failure::' + escaped)"

  windows-x64:
    name: Windows x64 / Python 3.13
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned analysis environment
        run: python -m pip install --disable-pip-version-check -r requirements-analysis.txt

      - name: Run offline tests
        env:
          AGENT_LAB_NO_BROWSER: "1"
        run: python -m pytest

  windows-arm-advisory:
    name: Windows ARM64 advisory / Python 3.13
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: windows-11-arm
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned analysis environment
        run: python -m pip install --disable-pip-version-check -r requirements-analysis.txt

      - name: Run supporting offline tests
        env:
          AGENT_LAB_NO_BROWSER: "1"
        run: python -m pytest
